<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>パッチ生成ツール</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
	<h1>パッチ生成ツール（試作）</h1>
	<p class="sub">過去アプリ向けパッチ配布物（購入者チェック付き）を生成します。詳細は
		<code>src/docs/legacy-app-patch.md</code> 参照。</p>
</header>

<main>
	<section class="global-config">
		<div class="field">
			<label>stub（汎用バイナリ本体）</label>
			<div class="path-picker">
				<input type="text" id="stubPath" readonly placeholder="patch_app のビルド済みバイナリを選択">
				<button type="button" id="btnPickStub">選択…</button>
			</div>
		</div>
		<div class="field">
			<label>出力先</label>
			<div class="path-picker">
				<input type="text" id="outPath" readonly placeholder="配布パッチアプリの出力先を選択">
				<button type="button" id="btnPickOut">選択…</button>
			</div>
		</div>
	</section>

	<section id="apps"></section>

	<button type="button" id="btnAddApp" class="btn-add-app">＋ アプリを追加</button>

	<section class="run">
		<button type="button" id="btnRun" class="btn-run">配布パッチアプリを生成</button>
	</section>

	<section class="result">
		<h2>実行ログ</h2>
		<pre id="resultLog">（未実行）</pre>
	</section>
</main>

<template id="tmplApp">
	<div class="app-card">
		<div class="app-card-header">
			<input type="text" class="appName" placeholder="appName（例: MyGame）">
			<button type="button" class="btn-remove-app" title="このアプリを削除">✕</button>
		</div>

		<div class="field">
			<label>pass.json</label>
			<div class="path-picker">
				<input type="text" class="passPath" readonly placeholder="プロジェクトの pass.json を選択">
				<button type="button" class="btnPickPass">選択…</button>
			</div>
		</div>

		<div class="field-row">
			<div class="field">
				<label>relPath</label>
				<input type="text" class="relPath" value="theme/setting.sn">
			</div>
			<div class="field field-checkbox">
				<label><input type="checkbox" class="crypto" checked> crypto:true（暗号化プロジェクト）</label>
			</div>
			<div class="field field-checkbox">
				<label><input type="checkbox" class="scanInstalled"> 実機にインストール済みの旧バージョンも自動スキャン</label>
			</div>
		</div>

		<div class="field">
			<label>downloadUrl</label>
			<input type="text" class="downloadUrl" placeholder="https://example.com/mygame-patch">
		</div>

		<div class="installer-groups">
			<div class="installer-group" data-os="mac">
				<h3>過去インストーラー（mac / .dmg）</h3>
				<div class="dropzone" data-target="mac">ここに .dmg をドラッグ＆ドロップ、またはボタンで選択</div>
				<button type="button" class="btn-pick-installer" data-os="mac">ファイルを選択…</button>
				<ul class="installer-list" data-os="mac"></ul>
			</div>
			<div class="installer-group" data-os="win">
				<h3>過去インストーラー（win / .exe）</h3>
				<div class="dropzone" data-target="win">ここに .exe をドラッグ＆ドロップ、またはボタンで選択</div>
				<button type="button" class="btn-pick-installer" data-os="win">ファイルを選択…</button>
				<ul class="installer-list" data-os="win"></ul>
			</div>
		</div>
	</div>
</template>

<script src="app.js"></script>
</body>
</html>
