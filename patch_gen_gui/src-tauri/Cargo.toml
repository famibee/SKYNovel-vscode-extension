[package]
name = "app"
version = "0.1.0"
description = "パッチ生成ツール（試作単体アプリ）"
authors = ["Famibee"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.3"
# ホスティング管理タブ（R2アップロード）用。SigV4署名の実装自体はこのSDKに任せる
# （自前実装は署名バグのリスクが高いため避ける）。aws-config（環境変数等からの
# 自動解決レイヤー）は使わず、Config::builder で直接エンドポイント・認証情報を
# 組み立てる（単一の固定認証情報しか扱わないため、自動探索機構は不要）
aws-sdk-s3 = "1"
# 最新版インストーラーのアップロード先キーに使うチェックサム計算用
# （同一内容の再アップロードでdownloadUrlが毎回変わるのを防ぐ。2026-09-17・ユーザー指摘）
sha2 = "0.10"
