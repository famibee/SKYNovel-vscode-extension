[package]
name = "sn_legacy_patch_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "過去アプリ向けパッチ配布（購入者チェック付き）の判定ロジック。詳細は sn_extension の src/docs/legacy-app-patch.md 参照"
publish = false

# 2026-10-22：GUIはTauri v2に決定（src-tauri/・ui/）。このCargo.tomlはUI非依存の判定ロジック
# （sn_legacy_patch_core）のみを持つlibクレートで、src-tauri側からpath依存で参照される。
# 経緯：最初egui（eframe）で着手したが、WebView非依存のメリットに対して実装工数が見合わない
# という指摘を受けTauriへ乗り換えた（legacy-app-patch.md参照）。[[bin]]・eframe/image依存は
# このため削除済み
[lib]
name = "sn_legacy_patch_core"
path = "src/lib.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"	# サイズ優先（同梱前提のため）
lto = true
codegen-units = 1
strip = true
panic = "abort"
